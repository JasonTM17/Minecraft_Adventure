name: docker-publish

on:
  push:
    branches: [main]

env:
  IMAGE: nguyenson1710/minecraft-adventure-web
  # GitHub Container Registry (ghcr.io) requires an all-lowercase path, so the
  # mixed-case owner is lowercased here. This is the image shown on the repo's
  # Packages tab; the Docker Hub image above is the public mirror.
  GHCR_IMAGE: ghcr.io/jasontm17/minecraft-adventure-web

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip gracefully on forks / before repo secrets are configured.
    if: ${{ github.repository_owner == 'JasonTM17' }}
    permissions:
      # GITHUB_TOKEN needs packages:write to push to ghcr.io; contents:read is
      # the default but stated explicitly for clarity.
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max