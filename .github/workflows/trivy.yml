name: trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t minecraft-adventure:scan .

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: minecraft-adventure:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
